<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio Distributori</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="stile.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</head>
<body>

<div class="container">
    <h1>Dashboard - Monitoraggio Distributori</h1>

    <h2>Aggiungi Nuovo Distributore</h2>
    <div class="card">
        <form id="addForm" class="form-group">
            <div class="form-input">
                <label for="idDistributore">ID Distributore:</label>
                <input type="text" id="idDistributore" placeholder="Es. DIST-01" required>
            </div>

            <div class="form-input">
                <label for="latitudine">Latitudine:</label>
                <input type="number" step="any" id="latitudine" placeholder="Es. 45.4642" required>
            </div>
            <div class="form-input">
                <label for="longitudine">Longitudine:</label>
                <input type="number" step="any" id="longitudine" placeholder="Es. 9.1900" required>
            </div>
            <button type="submit" class="blue-primary-btn">Salva Distributore</button>
        </form>
    </div>

    <div class="container mt-4">
        <h3>Mappa Distributori</h3>
        <div id="map" style="height: 400px; width: 100%; border: 1px solid black;"></div>    </div>

    <h2>Stato in Tempo Reale dei Distributori</h2>

    <div class="table-responsive">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Latitudine</th>
                <th>Longitudine</th>
                <th>Stato</th>
                <th>Ultimo Heartbeat</th>
                <th>Azioni</th>
            </tr>
            </thead>
            <tbody id="distributoriTableBody">
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
